name: API Documentation

on:
  pull_request:
    branches: [main]

jobs:
  # Runs on PRs targeting main — generates api.yaml and commits it back to the PR branch if stale
  update-api-docs:
    name: Update
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository

    permissions:
      contents: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.15.0'

      - name: Install dependencies
        run: npm ci

      - name: Build documentation
        run: npm run docs

      - name: Commit updated api.yaml if changed
        run: |
          if ! git diff --quiet -- api.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add api.yaml
            git commit -m "docs: regenerate api.yaml"
            git push origin HEAD:${{ github.head_ref }}
          else
            echo "api.yaml is up to date"
          fi
